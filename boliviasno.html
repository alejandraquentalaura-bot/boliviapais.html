
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolivia</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyz4kqb6Y2IbuXoqqGPxleTdrSBFHv0z3qBxFKpdCaMw&s=10");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    h1 {
        text-align: center;
        font-family: 'Permanent Marker', cursive;
        font-size: 100px;
        font-weight: bold;
        background: linear-gradient(to right, red, yellow);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 2px 2px 5px black;
    }

    .descripcion {
        background-color: cyan;
        color: black;
        border: 2px solid white;
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        font-size: 16px;
        margin: 20px;
        box-shadow: 2px 2px 8px black;
    }

    .contenido {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
    }

    .imagen {
        display: block;
        width: 180px;
        height: auto;
        margin: 18px;
        border-radius: 15px;
    }

    .tarjeta {
        display: inline-block;
        width: 180px;
        padding: 10px;
        margin: 20px;
        background-color: purple;
        border: 2px solid gold;
        border-radius: 20px;
        text-align: center;
        text-decoration: none;
        color: white;
        box-shadow: 2px 2px 8px black;
    }

    .tarjeta img {
        width: 100%;
        height: 120px;
        border-radius: 12px;
    }

    .tarjeta p {
        color: gold;
        font-weight: bold;
        font-size: 20px;
    }

</style>
</head>

<body>

    <h1>BOLIVIA</h1>

    <div class="descripcion">
        BOLIVIA ES UN PAÍS LLENO DE GASTRONOMÍA
        Y DANZAS
    </div>

    <div class="contenido">

        <img
            src="https://i.ibb.co/R4BG2qsz/1000181625-removebg-preview.png"
            alt="Imagen de Bolivia"
            class="imagen"
        >

        <a href="bolivia.html" class="tarjeta">

            <img
                src="https://thumbs.dreamstime.com/b/mapa-de-bolivia-coloreado-con-bandera-y-contorno-negro-298573974.jpg"
                alt="Paisaje de Bolivia"
            >

            <p>BOLIVIA</p>

            <span>Conoce nuestro país</span>

        </a>

    </div>

</body>
</html>
